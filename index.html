<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1230" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2752%27 font-size=%2750%27%3E%E2%AD%90%3C/text%3E%3C/svg%3E" />
    <title>Star Catch</title>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 id="title">Star Catch</h1>
        <div class="top-buttons">
          <button id="who" class="btn" type="button"></button>
          <button id="back" class="btn" type="button" aria-label="Back to the arcade" hidden>&larr; Arcade</button>
        </div>
      </header>
      <div id="hud" class="hud" aria-label="Scores"></div>
      <main id="stage" class="stage">
        <div id="board" class="board">
          <canvas id="canvas" role="img" aria-label="The game: coloured blobs catching falling stars"></canvas>
          <div id="overlay" class="overlay" hidden></div>
        </div>
      </main>
      <footer class="bar">
        <p class="help">Drag on the game, or use the arrow keys or W A S D.</p>
        <div id="together-slot"></div>
      </footer>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
